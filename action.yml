name: Setup Jev
description: Install a released stefafafan/jev binary and add it to PATH
author: stefafafan

inputs:
  version:
    description: Jev version to install (vMAJOR.MINOR.PATCH or latest)
    required: true

outputs:
  version:
    description: Installed Jev version without the leading v
    value: ${{ steps.install-unix.outputs.version || steps.install-windows.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install Jev
      id: install-unix
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: '"$GITHUB_ACTION_PATH/scripts/install.sh" "$INPUT_VERSION"'
    - name: Install Jev
      id: install-windows
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: '& (Join-Path $env:GITHUB_ACTION_PATH "scripts/install.ps1") -Version $env:INPUT_VERSION'

branding:
  icon: check-circle
  color: gray-dark
