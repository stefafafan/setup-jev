name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Bash
        run: |
          bash -n scripts/install.sh
          shellcheck scripts/install.sh
      - name: Check PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  install:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./
        with:
          version: v0.1.1
      - name: Verify installation
        shell: pwsh
        run: |
          if ((jev --version) -ne 'jev 0.1.1') {
            throw 'jev did not report the requested version'
          }
          if ('${{ steps.setup.outputs.version }}' -ne '0.1.1') {
            throw 'the version output is incorrect'
          }

  latest:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: latest
        uses: ./
        with:
          version: latest
      - name: Verify latest release
        env:
          INSTALLED_VERSION: ${{ steps.latest.outputs.version }}
        shell: pwsh
        run: |
          if ((jev --version) -ne "jev $env:INSTALLED_VERSION") {
            throw 'jev did not report the resolved latest version'
          }

  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: invalid
        continue-on-error: true
        uses: ./
        with:
          version: 1.2.3
      - name: Verify invalid version is rejected
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: test "$OUTCOME" = failure
